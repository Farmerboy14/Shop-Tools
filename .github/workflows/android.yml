name: Build Silage Loads APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's Ubuntu runners ship with the Android SDK already installed,
      # so there is nothing to fetch from Google here.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silage-loads-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Artifacts need a GitHub login to download, which the other drivers
      # won't have. A release asset is a plain public link they can tap.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk silage-loads.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Silage Loads — latest build" \
            --notes "Install on Android: tap the .apk below, then allow installs from your browser when asked. Installing over an existing copy keeps your loads."
          # Must not be a prerelease, or /releases/latest/download/ 404s.
          gh release edit latest --prerelease=false --latest
          gh release upload latest silage-loads.apk --clobber
