<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loads — Quick Counter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16140e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Modern-farmer dark theme: soil charcoal, harvest amber. */
  :root{
    --bg:#16140e; --panel:#201d14; --ink:#f2ebdb; --muted:#a89f89; --line:#3d382a;
    --accent:#ffb020; --accent2:#e08e07; --accent-ink:#211500;
    --mono:ui-monospace,"Roboto Mono","Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,"Roboto","Segoe UI",sans-serif;
  }
  :root[data-theme="dark"]{ --bg:#16140e; --panel:#201d14; --ink:#f2ebdb; --muted:#a89f89;
           --line:#3d382a; --accent:#ffb020; --accent2:#e08e07; --accent-ink:#211500; }
  :root[data-theme="light"]{ --bg:#efede3; --panel:#fffdf6; --ink:#26221a; --muted:#6d6553;
           --line:#d8d2bf; --accent:#c87f0a; --accent2:#a86504; --accent-ink:#fffdf6; }
  html,body{height:100%; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); overscroll-behavior:none;
       -webkit-tap-highlight-color:transparent; touch-action:manipulation;
       -webkit-user-select:none; user-select:none;
       display:flex; flex-direction:column;
       padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
       box-sizing:border-box; max-width:520px; margin:0 auto;}
  #top{display:flex; align-items:center; gap:8px;}
  #job{flex:1; font:600 13px/1.3 var(--sans); letter-spacing:.06em; color:var(--muted);
       text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #full{font:800 11px/1 var(--sans); letter-spacing:.1em; color:var(--muted);
        border:2px solid var(--line); border-radius:9px; padding:9px 10px;
        background:var(--panel); text-decoration:none;}
  #count{font:700 clamp(110px,42vmin,240px)/1 var(--mono); font-variant-numeric:tabular-nums;
         letter-spacing:-.03em; text-align:center; margin:2vh 0 1vh; color:var(--accent);
         text-shadow:0 0 30px rgba(255,176,32,.18);}
  #today{font:600 12px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase;
         color:var(--muted); text-align:center;}
  #plus{flex:1; margin-top:2vh; border:none; border-radius:18px; cursor:pointer;
        background:linear-gradient(180deg, var(--accent), var(--accent2)); color:var(--accent-ink);
        font:900 min(15vmin,72px)/1 var(--sans); box-shadow:0 5px 0 rgba(0,0,0,.4);}
  #plus:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.4); filter:brightness(.94);}
  #minus{margin-top:12px; padding:2.4vh 0; border-radius:12px; cursor:pointer;
         border:2px solid var(--line); background:var(--panel); color:var(--muted);
         font:800 28px/1 var(--sans);}
  #minus:active{transform:translateY(1px);}
</style>
</head>
<body>
  <div id="top">
    <div id="job"></div>
    <a id="full" href="./">FULL APP</a>
  </div>
  <div id="count">0</div>
  <div id="today">Loads today</div>
  <button id="plus" type="button">+</button>
  <button id="minus" type="button">−</button>

<script>
"use strict";
(() => {
  // Same storage key and data shape as the full app — both stay in sync.
  const KEY = "silage-loads-v1";
  let mem = null;
  const store = {
    get(){ try { return localStorage.getItem(KEY); } catch(e){ return mem; } },
    set(v){ mem = v; try { localStorage.setItem(KEY, v); } catch(e){} }
  };

  const pad = n => String(n).padStart(2, "0");
  const todayKey = () => { const d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };

  function migrate(s){
    for (const j of s.jobs) for (const k in j.days){
      const d = j.days[k];
      if (!d.loads) d.loads = (d.times || []).map(t => ({ t }));
      delete d.times;
    }
    return s;
  }

  function load(){
    const raw = store.get();
    if (raw){
      try { const s = JSON.parse(raw);
        if (s && Array.isArray(s.jobs) && s.jobs.length) return migrate(s); } catch(e){}
    }
    const job = { id: "j" + Math.random().toString(36).slice(2,9), name: "Job 1",
                  created: "2026-07-27", days: { "2026-07-27": { count: 10, loads: [] } } };
    const s = { jobs: [job], active: job.id };
    store.set(JSON.stringify(s));
    return s;
  }

  const activeJob = s => s.jobs.find(j => j.id === s.active) || s.jobs[0];

  function render(){
    const s = load();
    const job = activeJob(s);
    const day = job.days[todayKey()];
    document.getElementById("job").textContent = job.name;
    document.getElementById("count").textContent = (day && day.count) || 0;
  }

  function bump(delta){
    const s = load();
    const job = activeJob(s);
    const k = todayKey();
    const day = job.days[k] || (job.days[k] = { count: 0, loads: [] });
    day.count = Math.max(0, day.count + delta);
    if (delta > 0){
      const t = Date.now();
      day.loads.push({ t });
      geoStamp(job.id, k, t);
    } else if (day.loads.length) day.loads.pop();
    store.set(JSON.stringify(s));
    render();
  }

  // Attach GPS coords to a just-logged load once the fix arrives.
  function geoStamp(jobId, key, t){
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos => {
      const s = load();
      const job = s.jobs.find(j => j.id === jobId);
      const day = job && job.days[key];
      const entry = day && day.loads.find(l => l.t === t);
      if (entry){
        entry.lat = +pos.coords.latitude.toFixed(5);
        entry.lng = +pos.coords.longitude.toFixed(5);
        store.set(JSON.stringify(s));
      }
    }, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  }

  document.getElementById("plus").addEventListener("click", () => {
    bump(+1);
    if (navigator.vibrate) navigator.vibrate(30);
  });
  document.getElementById("minus").addEventListener("click", () => bump(-1));

  // Live-sync if the full app changes the count, and roll over at midnight.
  window.addEventListener("storage", e => { if (e.key === KEY) render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(render, 60000);
  render();

  if ("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
