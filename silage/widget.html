<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loads — Quick Counter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131518">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#eef0ec; --panel:#ffffff; --ink:#191c1f; --muted:#5f666d; --line:#d3d6d0;
    --accent:#c96a00; --accent-ink:#ffffff;
    --mono:ui-monospace,"Roboto Mono","Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,"Roboto","Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131518; --panel:#1c1f23; --ink:#e7eaed; --muted:#8f969e; --line:#31363c;
           --accent:#ff9026; --accent-ink:#1a1002; }
  }
  :root[data-theme="dark"]{ --bg:#131518; --panel:#1c1f23; --ink:#e7eaed; --muted:#8f969e;
           --line:#31363c; --accent:#ff9026; --accent-ink:#1a1002; }
  :root[data-theme="light"]{ --bg:#eef0ec; --panel:#ffffff; --ink:#191c1f; --muted:#5f666d;
           --line:#d3d6d0; --accent:#c96a00; --accent-ink:#ffffff; }
  html,body{height:100%; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); overscroll-behavior:none;
       -webkit-tap-highlight-color:transparent; touch-action:manipulation;
       -webkit-user-select:none; user-select:none;
       display:flex; flex-direction:column;
       padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
       box-sizing:border-box; max-width:520px; margin:0 auto;}
  #top{display:flex; align-items:center; gap:8px;}
  #job{flex:1; font:600 13px/1.3 var(--sans); letter-spacing:.06em; color:var(--muted);
       text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #full{font:700 11px/1 var(--sans); letter-spacing:.08em; color:var(--muted);
        border:1.5px solid var(--line); border-radius:6px; padding:9px 10px;
        background:var(--panel); text-decoration:none;}
  #count{font:600 clamp(110px,42vmin,240px)/1 var(--mono); font-variant-numeric:tabular-nums;
         letter-spacing:-.03em; text-align:center; margin:2vh 0 1vh;}
  #today{font:600 12px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase;
         color:var(--muted); text-align:center;}
  #plus{flex:1; margin-top:2vh; border:none; border-radius:14px; cursor:pointer;
        background:var(--accent); color:var(--accent-ink);
        font:800 min(15vmin,72px)/1 var(--sans);}
  #plus:active{transform:translateY(2px); filter:brightness(.92);}
  #minus{margin-top:10px; padding:2.4vh 0; border-radius:10px; cursor:pointer;
         border:1.5px solid var(--line); background:var(--panel); color:var(--muted);
         font:800 28px/1 var(--sans);}
  #minus:active{transform:translateY(1px);}
</style>
</head>
<body>
  <div id="top">
    <div id="job"></div>
    <a id="full" href="./">FULL APP</a>
  </div>
  <div id="count">0</div>
  <div id="today">Loads today</div>
  <button id="plus" type="button">+</button>
  <button id="minus" type="button">−</button>

<script>
"use strict";
(() => {
  // Same storage key and data shape as the full app — both stay in sync.
  const KEY = "silage-loads-v1";
  let mem = null;
  const store = {
    get(){ try { return localStorage.getItem(KEY); } catch(e){ return mem; } },
    set(v){ mem = v; try { localStorage.setItem(KEY, v); } catch(e){} }
  };

  const pad = n => String(n).padStart(2, "0");
  const todayKey = () => { const d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };

  function load(){
    const raw = store.get();
    if (raw){
      try { const s = JSON.parse(raw);
        if (s && Array.isArray(s.jobs) && s.jobs.length) return s; } catch(e){}
    }
    const job = { id: "j" + Math.random().toString(36).slice(2,9), name: "Job 1",
                  created: "2026-07-27", days: { "2026-07-27": { count: 10, times: [] } } };
    const s = { jobs: [job], active: job.id };
    store.set(JSON.stringify(s));
    return s;
  }

  const activeJob = s => s.jobs.find(j => j.id === s.active) || s.jobs[0];

  function render(){
    const s = load();
    const job = activeJob(s);
    const day = job.days[todayKey()];
    document.getElementById("job").textContent = job.name;
    document.getElementById("count").textContent = (day && day.count) || 0;
  }

  function bump(delta){
    const s = load();
    const job = activeJob(s);
    const k = todayKey();
    const day = job.days[k] || (job.days[k] = { count: 0, times: [] });
    day.count = Math.max(0, day.count + delta);
    if (delta > 0) day.times.push(Date.now());
    else if (day.times.length) day.times.pop();
    store.set(JSON.stringify(s));
    render();
  }

  document.getElementById("plus").addEventListener("click", () => {
    bump(+1);
    if (navigator.vibrate) navigator.vibrate(30);
  });
  document.getElementById("minus").addEventListener("click", () => bump(-1));

  // Live-sync if the full app changes the count, and roll over at midnight.
  window.addEventListener("storage", e => { if (e.key === KEY) render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(render, 60000);
  render();

  if ("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
