<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silage Loads</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16140e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Modern-farmer dark theme: soil charcoal, harvest amber, field green. */
  :root{
    --bg:#16140e; --panel:#201d14; --panel2:#2a2619; --ink:#f2ebdb; --muted:#a89f89;
    --line:#3d382a; --accent:#ffb020; --accent2:#e08e07; --accent-ink:#211500;
    --good:#9ccb50; --warn:#ff6b47;
    --mono:ui-monospace,"Roboto Mono","Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,"Roboto","Segoe UI",sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#16140e; --panel:#201d14; --panel2:#2a2619; --ink:#f2ebdb; --muted:#a89f89;
    --line:#3d382a; --accent:#ffb020; --accent2:#e08e07; --accent-ink:#211500;
    --good:#9ccb50; --warn:#ff6b47;
  }
  :root[data-theme="light"]{
    --bg:#efede3; --panel:#fffdf6; --panel2:#f2eee1; --ink:#26221a; --muted:#6d6553;
    --line:#d8d2bf; --accent:#c87f0a; --accent2:#a86504; --accent-ink:#fffdf6;
    --good:#4d7c1f; --warn:#b3401e;
  }
  html,body{height:100%; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); overscroll-behavior:none;
       -webkit-tap-highlight-color:transparent; touch-action:manipulation;
       -webkit-text-size-adjust:100%; text-size-adjust:100%;
       -webkit-user-select:none; user-select:none;}
  input{-webkit-user-select:text; user-select:text;}
  #app{max-width:520px; margin:0 auto; padding:12px 14px calc(20px + env(safe-area-inset-bottom));
       display:flex; flex-direction:column; gap:12px;}

  header{display:flex; align-items:center; gap:10px;}
  header h1{font:800 16px/1.15 var(--sans); letter-spacing:.12em; text-transform:uppercase; margin:0; flex:1;}
  header .hbtn{white-space:nowrap;}
  .hbtn{font:800 12px/1 var(--sans); letter-spacing:.1em; padding:11px 12px; border-radius:9px;
        border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;}
  .hbtn:active{transform:translateY(1px); background:var(--panel2);}
  .hbtn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .card{border:2px solid var(--line); border-radius:12px; background:var(--panel); padding:14px;
        box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .lbl{font:700 11px/1 var(--sans); letter-spacing:.18em; text-transform:uppercase; color:var(--muted);}

  #clockCard{display:flex; align-items:center; gap:12px; padding:12px 14px;}
  #clockTime{font:600 clamp(40px,13vw,56px)/1 var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
  #clockTime small{font-size:.45em; font-weight:500; color:var(--muted); margin-left:4px;}
  #clockDate{font:500 13px/1.3 var(--sans); color:var(--muted); margin-top:4px;}
  #awakeBtn, #dimBtn{font:800 11px/1.35 var(--sans); letter-spacing:.1em; padding:11px 12px;
            border-radius:9px; border:2px solid var(--line); background:var(--panel); color:var(--muted);
            cursor:pointer; text-align:center;}
  #awakeBtn{margin-left:auto;}
  #awakeBtn:active, #dimBtn:active{transform:translateY(1px); background:var(--panel2);}
  #awakeBtn.on, #dimBtn.on{border-color:var(--good); color:var(--good);}

  /* near-black idle screen: OLED pixels off = minimal battery */
  #dim{position:fixed; inset:0; z-index:99; background:#000; display:flex; flex-direction:column;
       align-items:center; justify-content:center; gap:10px; cursor:pointer;}
  #dim[hidden]{display:none;}
  #dimCount{font:600 62vmin/1 var(--mono); font-variant-numeric:tabular-nums; color:#4a5058;}
  #dimClock{font:500 10vmin/1 var(--mono); font-variant-numeric:tabular-nums; color:#3a4046;}
  #dimHint{font:600 11px/1 var(--sans); letter-spacing:.14em; color:#26292d;}

  #jobRow{display:flex; align-items:center; gap:8px;}
  #jobName{font:700 18px/1.2 var(--sans); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #jobStarted{font:400 12px/1 var(--sans); color:var(--muted);}

  #todayCard{text-align:center; padding:18px 14px 16px;}
  #todayCount{font:700 clamp(72px,30vw,128px)/1 var(--mono); font-variant-numeric:tabular-nums;
              letter-spacing:-.02em; margin:6px 0 2px; color:var(--accent);
              text-shadow:0 0 24px rgba(255,176,32,.18);}
  #lastLoad{font:400 13px/1 var(--sans); color:var(--muted); min-height:16px;}
  #bigBtn{width:100%; margin-top:14px; padding:26px 0; border-radius:14px; border:none; cursor:pointer;
          background:linear-gradient(180deg, var(--accent), var(--accent2)); color:var(--accent-ink);
          font:900 24px/1 var(--sans); letter-spacing:.12em;
          box-shadow:0 4px 0 rgba(0,0,0,.4);}
  #bigBtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.4); filter:brightness(.94);}
  #undoBtn{margin-top:12px; width:100%; padding:13px 0; border-radius:9px; cursor:pointer;
           border:2px solid var(--line); background:var(--panel); color:var(--muted);
           font:800 14px/1 var(--sans); letter-spacing:.1em;}
  #undoBtn:active{transform:translateY(1px); background:var(--panel2);}

  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{border:2px solid var(--line); border-radius:12px; background:var(--panel); padding:12px 14px;
        text-align:center; box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .stat b{font:700 34px/1.2 var(--mono); font-variant-numeric:tabular-nums; display:block; margin-top:4px;}

  #histList{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
  .hrow{display:flex; align-items:center; gap:8px; padding:10px 12px; border:2px solid var(--line);
        border-radius:9px; background:var(--panel2);}
  .hrow .d{flex:1; font:500 14px/1.2 var(--sans); cursor:pointer;}
  .hrow .d small{display:block; color:var(--muted); font-size:11px; margin-top:2px;}
  .hrow .caret{color:var(--muted); font-size:11px;}
  .hdetail{border:2px solid var(--line); border-top:none; border-radius:0 0 9px 9px;
           background:var(--panel); padding:4px 12px 8px; margin-top:-8px;}
  .load-line{display:flex; align-items:center; gap:12px; padding:8px 0;
             border-bottom:1px solid var(--line); font:400 14px/1.2 var(--sans);}
  .load-line:last-child{border-bottom:none;}
  .load-line .ln{font:600 13px/1 var(--mono); color:var(--muted); min-width:30px;}
  .load-line .lt{flex:1; font:500 15px/1 var(--mono); font-variant-numeric:tabular-nums;}
  .maplink{font:800 12px/1 var(--sans); letter-spacing:.06em; color:var(--accent);
           text-decoration:none; border:2px solid var(--accent); border-radius:8px; padding:7px 9px;}
  .noloc{font-size:12px; color:var(--muted);}
  .muted-line{color:var(--muted); font-size:13px;}
  .autotag{font:700 10px/1 var(--sans); letter-spacing:.08em; color:var(--good);
           border:1px solid var(--good); border-radius:4px; padding:3px 5px;}

  /* ---------- AUTO COUNT / DUMP ZONE ---------- */
  #autoBtn.on{border-color:var(--good); color:var(--good);}
  .zoneinfo{font:400 13px/1.6 var(--sans); color:var(--muted); margin:10px 0 2px; min-height:20px;}
  .zoneinfo b{color:var(--ink);}
  .zoneinfo a{color:var(--accent); font-weight:700; text-decoration:none;}
  .chiprow{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px;}
  .rchip{font:700 12px/1 var(--mono); padding:10px 11px; border:2px solid var(--line);
         border-radius:9px; background:var(--panel); color:var(--ink); cursor:pointer;}
  .rchip.on{border-color:var(--accent); color:var(--accent);}
  .coordrow{display:flex; gap:8px; margin-top:10px;}
  .coordrow input{flex:1; min-width:0; font:500 14px/1.3 var(--mono); padding:11px 12px;
                  border-radius:9px; border:2px solid var(--line);
                  background:var(--panel2); color:var(--ink);}
  .coordrow input::placeholder{font-family:var(--sans); font-size:13px;}
  .coordrow .hbtn{padding:11px 16px;}
  .hrow b{font:600 22px/1 var(--mono); font-variant-numeric:tabular-nums; min-width:44px; text-align:right;}
  .mini{font:800 18px/1 var(--mono); width:42px; height:42px; border-radius:9px; cursor:pointer;
        border:2px solid var(--line); background:var(--panel); color:var(--ink);}
  .mini:active{transform:translateY(1px); background:var(--panel2);}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:10px 0;}

  /* panels (new job / manage jobs) */
  .panel{display:none;}
  .panel.open{display:block;}
  .panel input[type=text]{width:100%; box-sizing:border-box; font:500 16px/1.3 var(--sans);
        padding:12px; border-radius:9px; border:2px solid var(--line);
        background:var(--panel2); color:var(--ink); margin-top:8px;}
  .prow{display:flex; gap:8px; margin-top:10px;}
  .prow .hbtn{flex:1; padding:13px 0; text-align:center;}
  .jobitem{display:flex; align-items:center; gap:8px; padding:10px 12px; margin-top:6px;
           border:2px solid var(--line); border-radius:9px; background:var(--panel2); cursor:pointer;}
  .jobitem.active{border-color:var(--accent);}
  .jobitem .jn{flex:1; font:600 14px/1.3 var(--sans);}
  .jobitem .jn small{display:block; font-weight:400; color:var(--muted); font-size:11px; margin-top:2px;}
  .jobitem .tot{font:600 18px/1 var(--mono); color:var(--muted);}
  .danger{color:var(--warn); border-color:var(--warn);}
  footer{text-align:center; color:var(--muted); font-size:11px; letter-spacing:.06em;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Silage Loads</h1>
    <a class="hbtn" id="widgetLink" href="widget.html" style="text-decoration:none;">BIG +/−</a>
    <button class="hbtn" id="jobsBtn" type="button">JOBS</button>
    <button class="hbtn primary" id="newJobBtn" type="button">+ NEW JOB</button>
  </header>

  <div class="card panel" id="newJobPanel">
    <div class="lbl">Start a new job</div>
    <input type="text" id="newJobName" placeholder="Job name (field, farm, crop…)" maxlength="40">
    <div class="prow">
      <button class="hbtn" id="newJobCancel" type="button">CANCEL</button>
      <button class="hbtn primary" id="newJobStart" type="button">START TRACKING</button>
    </div>
  </div>

  <div class="card panel" id="jobsPanel">
    <div class="lbl">Jobs — tap to switch</div>
    <div id="jobsList"></div>
    <div class="lbl" style="margin-top:14px;">Rename current job</div>
    <input type="text" id="renameInput" maxlength="40">
    <div class="prow">
      <button class="hbtn" id="renameBtn" type="button">RENAME</button>
      <button class="hbtn danger" id="deleteBtn" type="button">DELETE JOB</button>
    </div>
  </div>

  <div class="card" id="clockCard">
    <div>
      <div id="clockTime">--:--</div>
      <div id="clockDate"></div>
    </div>
    <button id="awakeBtn" type="button">KEEP<br>SCREEN ON</button>
    <button id="dimBtn" type="button">AUTO<br>DIM</button>
  </div>

  <div class="card">
    <div id="jobRow">
      <div style="flex:1; min-width:0;">
        <div class="lbl">Current job</div>
        <div id="jobName"></div>
      </div>
      <div id="jobStarted"></div>
    </div>
  </div>

  <div class="card" id="todayCard">
    <div class="lbl" id="todayLbl">Today</div>
    <div id="todayCount">0</div>
    <div id="lastLoad"></div>
    <button id="bigBtn" type="button">+ LOAD HAULED</button>
    <button id="undoBtn" type="button">− UNDO LAST LOAD</button>
  </div>

  <div class="card" id="autoCard">
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="lbl" style="flex:1;">Auto count · dump zone</div>
      <button class="hbtn" id="autoBtn" type="button">AUTO OFF</button>
    </div>
    <div class="zoneinfo" id="zoneInfo"></div>
    <div class="chiprow" id="radiusRow"></div>
    <div class="prow">
      <button class="hbtn" id="zoneSetBtn" type="button">SET ZONE AT MY SPOT</button>
      <button class="hbtn" id="zoneClearBtn" type="button">CLEAR</button>
    </div>
    <div class="coordrow">
      <input type="text" id="coordInput" inputmode="text" autocomplete="off"
             placeholder="or paste coordinates: 43.61234, -96.54321">
      <button class="hbtn" id="coordBtn" type="button">SET</button>
    </div>
  </div>

  <div class="statgrid">
    <div class="stat"><span class="lbl">Yesterday</span><b id="yestCount">0</b></div>
    <div class="stat"><span class="lbl">Job total</span><b id="jobTotal">0</b></div>
  </div>

  <div class="card">
    <div class="lbl">History (this job)</div>
    <div id="histList"></div>
  </div>

  <footer>Counts save on this phone automatically</footer>
</div>

<div id="dim" hidden>
  <div id="dimCount">0</div>
  <div id="dimClock"></div>
  <div id="dimHint">LOADS TODAY · TAP TO WAKE</div>
</div>

<script>
"use strict";
(() => {
  const KEY = "silage-loads-v1";

  // localStorage with in-memory fallback (private mode etc.)
  let mem = null;
  const store = {
    get(){ try { return localStorage.getItem(KEY); } catch(e){ return mem; } },
    set(v){ mem = v; try { localStorage.setItem(KEY, v); } catch(e){} }
  };

  const pad = n => String(n).padStart(2, "0");
  const dateKey = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  const todayKey = () => dateKey(new Date());
  const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate()-1); return dateKey(d); };

  const fmtTime = t => new Date(t).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  const expandedDays = new Set();

  function niceDate(key){
    const [y,m,d] = key.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
  }

  function newJob(name){
    return { id: "j" + Math.random().toString(36).slice(2,9), name, created: todayKey(), days: {} };
  }

  // Older versions stored plain timestamps in day.times; now each load is
  // a record {t, lat, lng} in day.loads.
  function migrate(s){
    for (const j of s.jobs) for (const k in j.days){
      const d = j.days[k];
      if (!d.loads) d.loads = (d.times || []).map(t => ({ t }));
      delete d.times;
    }
    return s;
  }

  function load(){
    const raw = store.get();
    if (raw){
      try {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.jobs) && s.jobs.length) return migrate(s);
      } catch(e){}
    }
    // First run: seed with 10 loads hauled on Jul 27, 2026.
    const job = newJob("Job 1");
    job.created = "2026-07-27";
    job.days["2026-07-27"] = { count: 10, loads: [] };
    const s = { jobs: [job], active: job.id };
    store.set(JSON.stringify(s));
    return s;
  }

  let state = load();
  const save = () => store.set(JSON.stringify(state));
  const activeJob = () => state.jobs.find(j => j.id === state.active) || state.jobs[0];
  const dayCount = (job, key) => (job.days[key] && job.days[key].count) || 0;
  const jobTotal = job => Object.values(job.days).reduce((a,d) => a + d.count, 0);

  function bump(jobId, key, delta, logTime){
    // Re-read storage first so a count added from the widget view isn't clobbered.
    state = load();
    const job = state.jobs.find(j => j.id === jobId) || activeJob();
    const day = job.days[key] || (job.days[key] = { count: 0, loads: [] });
    day.count = Math.max(0, day.count + delta);
    if (delta > 0 && logTime){
      const t = Date.now();
      day.loads.push({ t });
      geoStamp(job.id, key, t);
    } else if (delta < 0 && day.loads.length) day.loads.pop();
    if (day.count === 0 && key !== todayKey()) delete job.days[key];
    save(); render();
  }

  // Attach GPS coords to a just-logged load once the fix arrives.
  function geoStamp(jobId, key, t){
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos => {
      state = load();
      const job = state.jobs.find(j => j.id === jobId);
      const day = job && job.days[key];
      const entry = day && day.loads.find(l => l.t === t);
      if (entry){
        entry.lat = +pos.coords.latitude.toFixed(5);
        entry.lng = +pos.coords.longitude.toFixed(5);
        save(); render();
      }
    }, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  }

  const $ = id => document.getElementById(id);

  function render(){
    const job = activeJob();
    state.active = job.id;
    const tk = todayKey(), yk = yesterdayKey();

    $("jobName").textContent = job.name;
    $("jobStarted").textContent = "since " + niceDate(job.created);
    $("todayLbl").textContent = "Today · " + niceDate(tk);
    $("todayCount").textContent = dayCount(job, tk);
    $("yestCount").textContent = dayCount(job, yk);
    $("jobTotal").textContent = jobTotal(job);

    const loads = (job.days[tk] && job.days[tk].loads) || [];
    $("lastLoad").textContent = loads.length
      ? "last load " + fmtTime(loads[loads.length-1].t)
      : "";

    // History, newest first. +/− on each row so a missed load can be fixed
    // later; tapping the date expands the load-by-load log (time + map pin).
    const hist = $("histList");
    hist.innerHTML = "";
    const keys = Object.keys(job.days).filter(k => dayCount(job,k) > 0 || k === tk).sort().reverse();
    if (!keys.length){
      hist.innerHTML = '<div class="empty">No loads yet — hit the big button.</div>';
    }
    for (const k of keys){
      const row = document.createElement("div");
      row.className = "hrow";
      const label = k === tk ? "Today" : (k === yk ? "Yesterday" : "");
      const isOpen = expandedDays.has(k);
      row.innerHTML =
        '<div class="d">' + niceDate(k) + " <span class='caret'>" + (isOpen ? "▾" : "▸") + "</span>" +
        (label ? "<small>" + label + "</small>" : "") + "</div>" +
        "<b>" + dayCount(job,k) + "</b>";
      row.querySelector(".d").addEventListener("click", () => {
        isOpen ? expandedDays.delete(k) : expandedDays.add(k);
        render();
      });
      const minus = document.createElement("button");
      minus.type = "button"; minus.className = "mini"; minus.textContent = "−";
      minus.addEventListener("click", () => bump(job.id, k, -1, false));
      const plus = document.createElement("button");
      plus.type = "button"; plus.className = "mini"; plus.textContent = "+";
      plus.addEventListener("click", () => bump(job.id, k, +1, false));
      row.appendChild(minus); row.appendChild(plus);
      hist.appendChild(row);

      if (isOpen){
        const det = document.createElement("div");
        det.className = "hdetail";
        const dLoads = (job.days[k] && job.days[k].loads) || [];
        if (!dLoads.length){
          det.innerHTML = '<div class="load-line muted-line">No stamped loads this day' +
            (dayCount(job,k) ? " (count was set by hand)" : "") + "</div>";
        }
        dLoads.forEach((l, i) => {
          const line = document.createElement("div");
          line.className = "load-line";
          const where = (l.lat != null && l.lng != null)
            ? '<a class="maplink" target="_blank" rel="noopener" href="https://maps.google.com/?q=' +
              l.lat + "," + l.lng + '">MAP 📍</a>'
            : '<span class="noloc">no location</span>';
          line.innerHTML = "<span class='ln'>#" + (i+1) + "</span><span class='lt'>" +
            fmtTime(l.t) + "</span>" + (l.auto ? "<span class='autotag'>AUTO</span>" : "") + where;
          det.appendChild(line);
        });
        hist.appendChild(det);
      }
    }

    renderJobs();
    renderZone();
    syncWatch();
    if (!dimEl.hidden) updateDimReadout();
  }

  function renderJobs(){
    const list = $("jobsList");
    list.innerHTML = "";
    for (const j of state.jobs){
      const el = document.createElement("div");
      el.className = "jobitem" + (j.id === state.active ? " active" : "");
      el.innerHTML = '<div class="jn">' + esc(j.name) + "<small>since " + niceDate(j.created) +
                     "</small></div>" + '<div class="tot">' + jobTotal(j) + "</div>";
      el.addEventListener("click", () => {
        state.active = j.id; save();
        deleteBtn.textContent = "DELETE JOB";
        $("renameInput").value = j.name;
        render();
      });
      list.appendChild(el);
    }
    const ri = $("renameInput");
    if (document.activeElement !== ri) ri.value = activeJob().name;
  }

  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---- main buttons ----
  $("bigBtn").addEventListener("click", () => {
    bump(activeJob().id, todayKey(), +1, true);
    if (navigator.vibrate) navigator.vibrate(30);
  });
  $("undoBtn").addEventListener("click", () => bump(activeJob().id, todayKey(), -1, false));

  // ---- new job panel ----
  const newJobPanel = $("newJobPanel"), jobsPanel = $("jobsPanel");
  $("newJobBtn").addEventListener("click", () => {
    jobsPanel.classList.remove("open");
    newJobPanel.classList.toggle("open");
    $("newJobName").value = "";
    if (newJobPanel.classList.contains("open")) $("newJobName").focus();
  });
  $("newJobCancel").addEventListener("click", () => newJobPanel.classList.remove("open"));
  $("newJobStart").addEventListener("click", () => {
    const name = $("newJobName").value.trim() || "Job " + (state.jobs.length + 1);
    const job = newJob(name);
    state.jobs.unshift(job);
    state.active = job.id;
    newJobPanel.classList.remove("open");
    save(); render();
  });

  // ---- jobs panel ----
  const deleteBtn = $("deleteBtn");
  $("jobsBtn").addEventListener("click", () => {
    newJobPanel.classList.remove("open");
    jobsPanel.classList.toggle("open");
    deleteBtn.textContent = "DELETE JOB";
  });
  $("renameBtn").addEventListener("click", () => {
    const name = $("renameInput").value.trim();
    if (name){ activeJob().name = name; save(); render(); }
  });
  deleteBtn.addEventListener("click", () => {
    if (deleteBtn.textContent !== "TAP AGAIN TO CONFIRM"){
      deleteBtn.textContent = "TAP AGAIN TO CONFIRM";
      return;
    }
    const job = activeJob();
    state.jobs = state.jobs.filter(j => j.id !== job.id);
    if (!state.jobs.length) state.jobs = [newJob("Job 1")];
    state.active = state.jobs[0].id;
    deleteBtn.textContent = "DELETE JOB";
    save(); render();
  });

  // ---- clock (updates once a minute — display has no seconds) ----
  function tickClock(){
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    const t = h + ":" + pad(now.getMinutes());
    $("clockTime").innerHTML = t + "<small>" + ampm + "</small>";
    $("clockDate").textContent = now.toLocaleDateString(undefined,
      {weekday:"long", month:"long", day:"numeric"});
    $("dimClock").textContent = t + " " + ampm;
  }
  (function clockLoop(){
    tickClock();
    setTimeout(clockLoop, 60000 - (Date.now() % 60000) + 250);
  })();

  // ---- keep screen on (wake lock) ----
  const AWAKE_KEY = "silage-loads-awake";
  const awakeBtn = $("awakeBtn");
  let wakeLock = null;
  let awakeWanted = false;
  try { awakeWanted = localStorage.getItem(AWAKE_KEY) === "1"; } catch(e){}

  function paintAwake(){
    awakeBtn.classList.toggle("on", !!wakeLock);
    awakeBtn.innerHTML = wakeLock ? "SCREEN<br>STAYING ON" : "KEEP<br>SCREEN ON";
  }
  async function acquireAwake(){
    if (!awakeWanted || wakeLock || document.hidden) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; paintAwake(); });
    } catch(e){ wakeLock = null; }
    paintAwake();
  }
  if ("wakeLock" in navigator){
    awakeBtn.addEventListener("click", async () => {
      awakeWanted = !wakeLock;
      try { localStorage.setItem(AWAKE_KEY, awakeWanted ? "1" : "0"); } catch(e){}
      if (awakeWanted) await acquireAwake();
      else if (wakeLock){ wakeLock.release(); wakeLock = null; }
      paintAwake();
    });
    // Some browsers refuse a wake lock before the first touch — retry on it.
    document.addEventListener("pointerdown", acquireAwake, { once:true });
    acquireAwake();
  } else {
    awakeBtn.style.display = "none";
  }

  // ---- auto-dim: near-black idle screen to save battery on the dash ----
  const DIM_KEY = "silage-loads-dim";
  const DIM_IDLE_MS = 10000;
  const dimEl = $("dim"), dimBtn = $("dimBtn");
  let dimWanted = false;
  try { dimWanted = localStorage.getItem(DIM_KEY) === "1"; } catch(e){}
  let dimTimer = null;

  function paintDim(){
    dimBtn.classList.toggle("on", dimWanted);
    dimBtn.innerHTML = dimWanted ? "DIM<br>IN 10s" : "AUTO<br>DIM";
  }
  function updateDimReadout(){
    const n = dayCount(activeJob(), todayKey());
    const el = $("dimCount");
    el.textContent = n;
    // as big as fits: shrink per extra digit so 2-3 digit counts stay on screen
    el.style.fontSize = (n >= 100 ? 36 : n >= 10 ? 50 : 62) + "vmin";
  }
  function armDim(){
    clearTimeout(dimTimer);
    if (dimWanted && !document.hidden) dimTimer = setTimeout(showDim, DIM_IDLE_MS);
  }
  function showDim(){
    if (!dimWanted || document.hidden) return;
    updateDimReadout(); tickClock();
    dimEl.hidden = false;
  }
  function hideDim(){ dimEl.hidden = true; armDim(); }
  function setDim(on){
    dimWanted = on;
    try { localStorage.setItem(DIM_KEY, on ? "1" : "0"); } catch(e){}
    if (!on) dimEl.hidden = true;
    paintDim(); armDim();
  }
  dimBtn.addEventListener("click", () => setDim(!dimWanted));
  window.__silageDim = { show: showDim };   // test hook: skip the 30 s idle wait
  dimEl.addEventListener("pointerdown", e => { e.stopPropagation(); hideDim(); });
  document.addEventListener("pointerdown", () => armDim(), true);
  paintDim(); armDim();

  // ---- auto count: circular dump zone, counts on entry ----
  const RADII = [
    { label:"300 FT", m:91 }, { label:"500 FT", m:152 },
    { label:"1000 FT", m:305 }, { label:"¼ MI", m:402 }
  ];
  let pendingR = 152;                       // radius chosen before a zone exists
  let watchId = null, watchJobId = null, pollTimer = null;
  let gpsMode = "off";                      // off | watch (continuous) | poll (battery saver)
  let pollDelay = 0;                        // current poll interval, for the status line
  let armed = false, lastAutoT = 0, lastFix = null;
  // Continuous high-accuracy GPS only when near the zone; coarse duty-cycled
  // checks otherwise. A truck can't cross NEAR_M faster than the poll interval.
  const NEAR_M = 1200, MAX_SPEED = 25;      // meters, m/s (~55 mph)

  function distM(lat1, lng1, lat2, lng2){
    const rad = x => x * Math.PI / 180;
    const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng/2)**2;
    return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  const fmtDist = m => m < 305 ? Math.round(m*3.28084) + " ft" : (m/1609.34).toFixed(1) + " mi";
  const radLabel = m => (RADII.find(r => r.m === m) || {label: Math.round(m*3.28084) + " ft"}).label;

  function autoCount(lat, lng){
    state = load();
    const job = activeJob();
    const k = todayKey();
    const day = job.days[k] || (job.days[k] = { count: 0, loads: [] });
    day.count++;
    day.loads.push({ t: Date.now(), lat: +lat.toFixed(5), lng: +lng.toFixed(5), auto: true });
    save(); render();
    if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  }

  function startContinuous(){
    if (pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
    if (watchId == null){
      watchId = navigator.geolocation.watchPosition(onFix, () => {},
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    }
    gpsMode = "watch";
  }

  function startPoll(delay){
    if (watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    gpsMode = "poll"; pollDelay = delay;
    clearTimeout(pollTimer);
    pollTimer = setTimeout(pollFix, delay);
  }

  function pollFix(){
    // Coarse fix is enough for scheduling far from the zone, and much cheaper.
    navigator.geolocation.getCurrentPosition(onFix,
      () => { if (gpsMode === "poll") startPoll(30000); },
      { enableHighAccuracy: false, maximumAge: 15000, timeout: 25000 });
  }

  function onFix(pos){
    lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const job = activeJob();
    const z = job.zone;
    if (!z || !z.auto) return;
    if (job.id !== watchJobId){ watchJobId = job.id; armed = false; }
    const d = distM(lastFix.lat, lastFix.lng, z.lat, z.lng);
    let counted = false;
    if (d <= z.r){
      // Count only on entry: must have been armed (i.e. genuinely outside) first,
      // with a cooldown so one entry can't double-fire.
      if (armed && Date.now() - lastAutoT > 60000){
        lastAutoT = Date.now(); armed = false;
        autoCount(lastFix.lat, lastFix.lng);
        counted = true;
      }
      armed = false;
    } else if (d > z.r + Math.max(60, z.r * 0.5)){
      armed = true;                          // clear of the jitter band — re-arm
    }
    // Pick the cheapest GPS mode that can't miss the next entry.
    const dOut = d - z.r;
    if (dOut <= NEAR_M) startContinuous();
    else startPoll(Math.min(120000, Math.max(20000, (dOut / MAX_SPEED) * 0.4 * 1000)));
    if (!counted) renderZone();              // autoCount already re-rendered
  }

  function syncWatch(){
    const z = activeJob().zone;
    const want = !!(z && z.auto) && !document.hidden && "geolocation" in navigator;
    if (want && gpsMode === "off"){
      armed = false; lastFix = null; watchJobId = activeJob().id;
      startContinuous();                     // one precise fix, then onFix picks the mode
    } else if (!want && gpsMode !== "off"){
      if (watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
      if (pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
      gpsMode = "off";
    }
  }

  // test hook: lets automated tests inspect the GPS state and skip poll waits
  window.__silageZone = {
    mode: () => gpsMode,
    debug: () => ({ gpsMode, armed, lastFix, lastAutoT, now: Date.now() }),
    pollNow: () => { if (gpsMode === "poll"){ clearTimeout(pollTimer); pollFix(); } }
  };

  function renderZone(){
    const job = activeJob();
    const z = job.zone;
    const autoBtn = $("autoBtn");
    autoBtn.textContent = z && z.auto ? "AUTO ON" : "AUTO OFF";
    autoBtn.classList.toggle("on", !!(z && z.auto));
    $("zoneSetBtn").textContent = z ? "MOVE ZONE TO MY SPOT" : "SET ZONE AT MY SPOT";
    $("zoneClearBtn").style.display = z ? "" : "none";

    const row = $("radiusRow");
    row.innerHTML = "";
    const cur = z ? z.r : pendingR;
    for (const r of RADII){
      const c = document.createElement("button");
      c.type = "button"; c.className = "rchip" + (r.m === cur ? " on" : "");
      c.textContent = r.label;
      c.addEventListener("click", () => {
        if (z){ state = load(); activeJob().zone.r = r.m; save(); }
        else pendingR = r.m;
        renderZone();
      });
      row.appendChild(c);
    }

    const info = $("zoneInfo");
    if (!z){
      info.innerHTML = "No zone yet — park where you dump, pick a size, and set it. " +
        "Every drive into the circle then counts a load (app must be on screen).";
    } else {
      let status;
      if (!z.auto) status = "auto counting is off";
      else if (!lastFix) status = "getting GPS…";
      else {
        const d = distM(lastFix.lat, lastFix.lng, z.lat, z.lng);
        status = d <= z.r ? "in the zone now"
               : fmtDist(d) + " out · " + (armed ? "ready to count next entry" : "leave a bit further to arm");
        if (gpsMode === "poll")
          status += " · GPS napping " + Math.round(pollDelay/1000) + "s (battery saver)";
      }
      info.innerHTML = "<b>" + radLabel(z.r) + "</b> circle · " +
        '<a target="_blank" rel="noopener" href="https://maps.google.com/?q=' + z.lat + "," + z.lng + '">MAP 📍</a>' +
        " — " + status;
    }
  }

  $("autoBtn").addEventListener("click", () => {
    state = load();
    const job = activeJob();
    if (!job.zone){
      $("zoneInfo").innerHTML = "<b>Set a zone first</b> — park at the pit and tap SET ZONE AT MY SPOT.";
      return;
    }
    job.zone.auto = !job.zone.auto;
    if (job.zone.auto){
      awakeWanted = true;
      try { localStorage.setItem(AWAKE_KEY, "1"); } catch(e){}
      acquireAwake();
    }
    save(); render();
  });

  $("zoneSetBtn").addEventListener("click", () => {
    if (!navigator.geolocation){ $("zoneInfo").textContent = "No GPS available on this device."; return; }
    $("zoneInfo").textContent = "Getting your position…";
    navigator.geolocation.getCurrentPosition(pos => {
      state = load();
      const job = activeJob();
      const keepAuto = job.zone ? job.zone.auto : false;
      job.zone = { lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5),
                   r: job.zone ? job.zone.r : pendingR, auto: keepAuto };
      save(); render();
    }, () => {
      $("zoneInfo").innerHTML = "<b>Couldn't get GPS.</b> Check location permission and try again.";
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });

  $("zoneClearBtn").addEventListener("click", () => {
    state = load();
    activeJob().zone = null;
    save(); render();
  });

  // Accepts "43.61234, -96.54321" (Google Maps copy format) and the
  // "43.61234° N, 96.54321° W" style. Returns {lat, lng} or null.
  function parseCoords(s){
    const m = s.match(/(-?\d{1,3}(?:\.\d+)?)\s*°?\s*([NnSs])?\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*°?\s*([EeWw])?/);
    if (!m) return null;
    let lat = parseFloat(m[1]), lng = parseFloat(m[3]);
    if (m[2] && m[2].toLowerCase() === "s") lat = -Math.abs(lat);
    if (m[4] && m[4].toLowerCase() === "w") lng = -Math.abs(lng);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat: +lat.toFixed(5), lng: +lng.toFixed(5) };
  }

  function setZoneFromInput(){
    const c = parseCoords($("coordInput").value.trim());
    if (!c){
      $("zoneInfo").innerHTML = "<b>Couldn't read those coordinates.</b> " +
        "Use the form 43.61234, -96.54321 (long-press the spot in Google Maps to copy them).";
      return;
    }
    state = load();
    const job = activeJob();
    const keepAuto = job.zone ? job.zone.auto : false;
    job.zone = { lat: c.lat, lng: c.lng, r: job.zone ? job.zone.r : pendingR, auto: keepAuto };
    $("coordInput").value = "";
    save(); render();
  }
  $("coordBtn").addEventListener("click", setZoneFromInput);
  $("coordInput").addEventListener("keydown", e => { if (e.key === "Enter") setZoneFromInput(); });

  // Live-sync when the widget view changes the count in another tab/window.
  window.addEventListener("storage", e => {
    if (e.key === KEY){ state = load(); render(); }
  });

  // Roll the display over at midnight / when the app comes back to the foreground.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden){ state = load(); render(); tickClock(); acquireAwake(); }
  });
  setInterval(render, 60000);

  render();

  if ("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
